name: Build and attest release files

on:
  workflow_dispatch:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  attest:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
      - name: Check tag against manifest
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./manifest.json').version")"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Attest the three installable files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
          create-storage-record: false
      - name: Save the signed build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hangle-editor-release
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 7
